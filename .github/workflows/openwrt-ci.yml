name: OpenWrt-CI

on:
  schedule:
    - cron: 0 20 * * *  # 每天北京时间凌晨4点运行
  workflow_dispatch:    # 允许手动触发

permissions:
  contents: read

jobs:

  build_openwrt:

    name: Build OpenWrt Firmware

    runs-on: ubuntu-latest


      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          echo "========== Initial disk usage =========="
          df -h
          df -i

          # 1. 清理 Docker 镜像和构建缓存
          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af || true
          fi

          # 2. 更新 APT 软件包索引
          sudo apt-get update

          # 3. 卸载不参与 OpenWrt 编译的大型预装软件
          # 只处理实际安装的软件包，避免通配符无匹配导致 APT 退出
          mapfile -t REMOVE_PKGS < <(
            dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' 2>/dev/null |
            awk '$1 == "ii" {print $2}' |
            grep -E '^(azure-cli|docker|ghc|zulu|firefox|google|dotnet|powershell|openjdk|mysql|php|mongodb|snapd)([-:].*)?$' || true
          )

          if [ "${#REMOVE_PKGS[@]}" -gt 0 ]; then
            echo "Removing packages: ${REMOVE_PKGS[*]}"
            sudo apt-get purge -y "${REMOVE_PKGS[@]}"
          else
            echo "No unnecessary packages found."
          fi

          # 4. 清理残留的大型目录
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android

          # 5. 安装 OpenWrt 编译依赖
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ack \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            help2man \
            intltool \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            ninja-build \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            unzip \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          # 6. 清理无用依赖和 APT 缓存
          sudo apt-get autoremove --purge -y
          sudo apt-get clean

          # 7. 输出构建环境信息
          echo "========== Operating System =========="
          cat /etc/os-release

          echo "========== Compiler =========="
          gcc --version
          g++ --version

          echo "========== Python =========="
          python3 --version

          echo "========== Build tools =========="
          cmake --version
          make --version

          echo "========== Disk usage =========="
          df -h
          df -i


      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        
      - name: Clone OpenClash
        run: |
          rm -rf ./package/luci-app-openclash
          mkdir -p ./package/luci-app-openclash
          git clone --depth 1 https://github.com/vernesong/OpenClash.git ./package/luci-app-openclash
        
      - name: Update feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration file
        run: |
          rm -f ./.config*
          touch ./.config
          
          #
          # 在 cat >> .config <<EOF 到 EOF 之间粘贴你的编译配置, 需注意缩进关系
          # 例如:

          cat >> .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_PACKAGE_miniupnpd=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152-vendor=n
          CONFIG_PACKAGE_ksmbd=n
          CONFIG_PACKAGE_autosamba=n
          CONFIG_PACKAGE_luci-app-ksmbd=n
          CONFIG_PACKAGE_luci-app-ddns=n
          CONFIG_PACKAGE_luci-app-upnp=n

          EOF

          #
          # ===============================================================
          # 

          sed -i 's/^[ \t]*//g' ./.config
          make defconfig

      - name: mnt
        run: |
          sudo mkdir -p -m 777 /mnt/dl
          sudo mkdir -p -m 777 /mnt/build_dir
          sudo ln -s /mnt/dl ./dl
          sudo ln -s /mnt/build_dir ./build_dir

      - name: Download packages
        run: |
          make download -j16
          df -h

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_package
          path: ./artifact/package/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ./bin/targets/
